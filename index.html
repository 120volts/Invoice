<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financial Brain v0.2</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:white;border-bottom:1px solid #ddd}
button{padding:10px 16px;border-radius:8px;border:1px solid #ccc;background:white;cursor:pointer}
main{max-width:900px;margin:auto;padding:24px}
.tabs{display:flex;gap:8px;overflow:auto;border-bottom:2px solid #ddd;padding-bottom:10px;margin-bottom:24px}
.tab{padding:10px 16px;border-radius:20px;background:#e9edf2;white-space:nowrap}
.active{background:#2563eb;color:white}
.card{background:white;padding:24px;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.footer{display:flex;justify-content:space-between;margin-top:24px}
.small{color:#666}
</style>
<script>
const topics=["Overview","Ownership","Workspace","Size","Business Use","Results"];
let current=0;
function render(){
 document.getElementById("tabs").innerHTML=topics.map((t,i)=>
 `<div class="tab ${i===current?'active':''}" onclick="gotoTopic(${i})">${t}</div>`).join("");
 document.getElementById("title").innerText=topics[current];
 document.getElementById("content").innerHTML=
 `<p class='small'>This section explains <b>${topics[current]}</b>. Users can leave at any time, return later, or jump to any topic.</p>`;
 document.getElementById("backBtn").disabled=current===0;
}
function gotoTopic(i){current=i;render();}
function prev(){if(current>0){current--;render();}}
function next(){if(current<topics.length-1){current++;render();}}
function exitGuide(){alert("Return to Opportunity Center. Progress is remembered.");}
window.onload=render;
</script>
</head>
<body>
<header>
<div>
<button id="backBtn" onclick="prev()">← Back</button>
</div>
<div><strong>Home Office Recommendation</strong></div>
<div>
<button onclick="exitGuide()">✕ Exit</button>
</div>
</header>
<main>
<div id="tabs" class="tabs"></div>

<div class="card">
<h2 id="title"></h2>
<div id="content"></div>
</div>

<div class="footer">
<button onclick="prev()">Previous</button>
<button onclick="next()">Next</button>
</div>
</main>
</body>
</html>
